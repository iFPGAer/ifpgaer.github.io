<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">加载中 | iFPGAer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chipBlue: '#00A3FF',
                        neonCyan: '#00F0C8',
                        neonPurple: '#7B2FFD',
                        darkBorder: 'rgba(0, 163, 255, 0.35)'
                    },
                    fontFamily: {
                        tech: ['Orbitron', 'Rajdhani', 'system-ui', 'sans-serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'float-up': 'floatUp 6s ease-in-out infinite'
                    },
                    keyframes: {
                        floatUp: {
                            '0%,100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-glow {
                text-shadow: 0 0 10px #00A3FF, 0 0 20px rgba(0,163,255,0.5);
            }
            .text-shadow {
                text-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
            }
            .card-hover {
                transition: all 0.25s ease;
            }
            .card-hover:hover {
                border-color:#00A3FF;
                background-color:rgba(0,163,255,0.10);
                transform: translateY(-2px);
            }
            .search-input {
                background: rgba(255,255,255,0.08);
                border: 1px solid rgba(0,163,255,0.3);
                color: #fff;
            }
            .search-input:focus {
                outline: none;
                border-color:#00A3FF;
                box-shadow: 0 0 8px rgba(0,163,255,0.3);
            }
            .search-input::placeholder {
                color: #aaa;
            }
        }
        * { scroll-behavior: smooth; }
        body { color: #F6F8FF; overflow-x: hidden; }
        .bg-img-layer {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-image: url('./assets/bg-fpga.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(1.05) contrast(1.08);
            transform: none;
            animation: none;
        }
        .bg-mask-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.3));
        }
        #particles-js {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="relative overflow-x-hidden font-sans min-h-screen flex flex-col justify-between">
    <div class="bg-img-layer"></div>
    <div id="particles-js"></div>
    <div class="bg-mask-layer"></div>

    <!-- 导航栏：使用容器，由nav.json动态渲染 -->
    <nav class="sticky top-0 bg-white/5 backdrop-blur-none border-b border-chipBlue/20 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-tech font-bold text-chipBlue flex items-center gap-3 text-glow">
                <i class="fa-solid fa-microchip text-3xl animate-float-up"></i>
                <span>iFPGAer</span>
            </a>
            <!-- PC导航自动渲染容器 -->
            <div class="hidden lg:flex gap-8 font-tech tracking-wide text-shadow" id="pcNavWrap"></div>
            <button class="lg:hidden text-white text-2xl text-shadow" id="menuBtn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <!-- 移动端菜单容器 -->
        <div class="lg:hidden hidden bg-black/60 backdrop-blur-md border-b border-chipBlue/20 absolute w-full" id="mobileMenu">
            <div class="container mx-auto px-4 py-4 flex flex-col gap-3 font-tech text-lg text-shadow" id="mobileNavWrap"></div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-10">
        <div class="bg-black/40 backdrop-blur-md rounded-xl p-6 md:p-8 border border-chipBlue/20">
            <h1 id="mainTitle" class="text-2xl md:text-3xl font-tech text-chipBlue text-glow mb-4">加载中...</h1>
            <p id="pageDesc" class="text-gray-200 mb-4"></p>

            <!-- 新增搜索框 -->
            <div class="relative mb-6 max-w-xl">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input id="searchInput" class="search-input w-full pl-10 pr-4 py-2 rounded-lg" placeholder="输入搜索内容...">
            </div>

            <div id="moduleListWrap" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">
                <div class="text-gray-400">内容加载中...</div>
            </div>
            <!-- 无搜索结果提示 -->
            <div id="emptyTip" class="hidden mt-8 text-center text-gray-400 text-lg">未匹配到相关内容</div>
        </div>
    </main>

    <footer class="border-t border-chipBlue/20 bg-black/10 py-3 mt-auto">
        <div class="container mx-auto px-4 text-center text-xs text-gray-300 text-shadow">
            <div class="flex flex-wrap justify-center gap-x-5 gap-y-1 mb-2">
                <span>Email:984962560@qq.com</span>
            </div>
            <p>© 2026 iFPGAer 仅用于学习交流</p>
        </div>
    </footer>

    <script>
        // ========= 导航渲染函数 和 index.html完全一致 =========
        async function renderNav() {
            try {
                const res = await fetch('./assets/nav.json');
                const navData = await res.json();
                const pcWrap = document.getElementById('pcNavWrap');
                const mobileWrap = document.getElementById('mobileNavWrap');
                pcWrap.innerHTML = '';
                mobileWrap.innerHTML = '';

                // 获取当前文件名，剥离url查询参数
                function getCurrentFile(){
                    const path = window.location.pathname;
                    return path.split('/').pop() || 'index.html';
                }
                const currentFile = getCurrentFile();

                navData.forEach(item => {
                    // ========= 移动端菜单 =========
                    if (item.isDrop) {
                        item.child.forEach(sub => {
                            const a = document.createElement('a');
                            a.className = "py-2 hover:text-chipBlue";
                            a.href = sub.link;
                            a.innerText = sub.name;
                            mobileWrap.appendChild(a);
                        })
                    } else {
                        const a = document.createElement('a');
                        a.className = "py-2 hover:text-chipBlue";
                        const navFile = item.link.split('?')[0];
                        if(navFile === currentFile){
                            a.classList.add('text-chipBlue', 'border-b', 'border-chipBlue', 'pb-1');
                        }
                        a.href = item.link;
                        a.innerText = item.name;
                        mobileWrap.appendChild(a);
                    }

                    // ========= PC端导航 =========
                    if (!item.isDrop) {
                        const a = document.createElement('a');
                        a.className = "hover:text-chipBlue";
                        const navFile = item.link.split('?')[0];
                        if(navFile === currentFile){
                            a.classList.add('text-chipBlue', 'border-b', 'border-chipBlue', 'pb-1');
                        }
                        a.href = item.link;
                        a.innerText = item.name;
                        pcWrap.appendChild(a);
                    } else {
                        const groupDiv = document.createElement('div');
                        groupDiv.className = "relative group pb-2";
                        const span = document.createElement('span');
                        span.className = "hover:text-chipBlue cursor-pointer flex items-center gap-1";
                        span.innerHTML = `${item.name} <i class="fa-solid fa-chevron-down text-xs"></i>`;

                        const dropBox = document.createElement('div');
                        dropBox.className = "absolute hidden group-hover:block top-full left-0 mt-0 bg-black/60 backdrop-blur-md rounded-lg p-4 w-44 pointer-events-auto";
                        item.child.forEach(sub => {
                            const subA = document.createElement('a');
                            subA.className = "block py-2 hover:text-chipBlue";
                            subA.href = sub.link;
                            subA.innerText = sub.name;
                            dropBox.appendChild(subA);
                        })
                        groupDiv.appendChild(span);
                        groupDiv.appendChild(dropBox);
                        pcWrap.appendChild(groupDiv);
                    }
                })
            } catch (err) {
                console.error('导航加载失败：', err);
                const pcWrap = document.getElementById('pcNavWrap');
                pcWrap.innerHTML = '<span class="text-red-400">导航配置读取失败，请检查assets/nav.json</span>';
            }
        }
        renderNav();

        // 全局缓存当前分类全部模块，用于搜索过滤
        let globalModuleList = [];
        // 移动端菜单逻辑
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const searchInput = document.getElementById('searchInput');
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            const icon = menuBtn.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-xmark');
        });
        document.querySelectorAll('#mobileMenu a').forEach(link => {
            link.onclick = () => mobileMenu.classList.add('hidden');
        });

        // 粒子背景
        particlesJS("particles-js", {
            particles: {
                number: { value: 30, density: { enable: true, value_area: 900 } },
                color: { value: "#00A3FF" },
                shape: { type: "circle" },
                opacity: { value: 0.15, random: true },
                size: { value: 1.2, random: true },
                line_linked: {
                    enable: true,
                    distance: 100,
                    color: "#00A3FF",
                    opacity: 0.06,
                    width: 0.4
                },
                move: {
                    enable: true,
                    speed: 0.4,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out"
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "grab" },
                    onclick: { enable: false },
                    resize: true
                },
                modes: { grab: { distance: 120, line_linked: { opacity: 0.2 } } }
            },
            retina_detect: true
        });

        // 渲染卡片函数（抽离，搜索复用）
        function renderCards(list) {
            const listWrap = document.getElementById('moduleListWrap');
            const emptyTip = document.getElementById('emptyTip');
            listWrap.innerHTML = '';
            emptyTip.classList.add('hidden');
            if (list.length === 0) {
                emptyTip.classList.remove('hidden');
                return;
            }
            list.forEach(item => {
                const a = document.createElement('a');
                a.className = "card-hover block p-4 bg-white/5 rounded-lg border border-chipBlue/20";
                const urlParams = new URLSearchParams(window.location.search);
                const catKey = urlParams.get('cat');
                a.href = `detail.html?md=${item.mdFile}&cat=${catKey}`;
                a.innerHTML = `
                    <h3 class="font-tech text-lg text-chipBlue mb-2">
                        <i class="fa-solid ${item.icon} mr-2"></i>${item.title}
                    </h3>
                    <p class="text-sm text-gray-300">${item.desc}</p>
                `;
                listWrap.appendChild(a);
            })
        }

        // 搜索过滤逻辑
        function handleSearch() {
            const keyword = searchInput.value.trim().toLowerCase();
            if (!keyword) {
                renderCards(globalModuleList);
                return;
            }
            const filterList = globalModuleList.filter(item => {
                const title = item.title.toLowerCase();
                const desc = item.desc.toLowerCase();
                return title.includes(keyword) || desc.includes(keyword);
            })
            renderCards(filterList);
        }
        // 实时输入监听
        searchInput.addEventListener('input', handleSearch);

        // 栏目渲染核心（带数组安全校验，缓存模块用于搜索）
        const urlParams = new URLSearchParams(window.location.search);
        const catKey = urlParams.get('cat');
        const titleDom = document.getElementById('pageTitle');
        const mainTitleDom = document.getElementById('mainTitle');
        const descDom = document.getElementById('pageDesc');
        const listWrap = document.getElementById('moduleListWrap');

        if (!catKey) {
            listWrap.innerHTML = '<div class="text-red-400 col-span-full">栏目参数错误，请从导航菜单进入页面</div>';
        } else {
            fetch('./assets/category.json')
                .then(res => res.json())
                .then(catList => {
                    const currCat = catList.find(item => item.catKey === catKey);
                    if (!currCat) {
                        listWrap.innerHTML = '<div class="text-red-400 col-span-full">不存在该分类栏目</div>';
                        return;
                    }
                    titleDom.innerText = currCat.pageTitle;
                    mainTitleDom.innerText = currCat.mainTitle;
                    descDom.innerText = currCat.desc;

                    fetch('./assets/modules.json')
                        .then(res => res.json())
                        .then(allModules => {
                            const moduleArr = allModules[catKey];
                            if (!Array.isArray(moduleArr)) {
                                listWrap.innerHTML = '<div class="text-gray-400 col-span-full">该分类暂无模块配置</div>';
                                return;
                            }
                            if (moduleArr.length === 0) {
                                listWrap.innerHTML = '<div class="text-gray-400 col-span-full">该分类下暂无文档模块</div>';
                                return;
                            }
                            // 存入全局变量供搜索调用
                            globalModuleList = moduleArr;
                            renderCards(moduleArr);
                        })
                        .catch(err => {
                            listWrap.innerHTML = `<div class="text-red-400 col-span-full">模块配置加载失败：${err.message}</div>`;
                        })
                })
                .catch(err => {
                    listWrap.innerHTML = `<div class="text-red-400 col-span-full">栏目配置加载失败：${err.message}</div>`;
                })
        }
    </script>
</body>
</html>
