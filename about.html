<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome iFPGAer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入粒子光点库 -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chipBlue: '#00A3FF',
                        neonCyan: '#00F0C8',
                        neonPurple: '#7B2FFD',
                        darkBorder: 'rgba(0, 163, 255, 0.35)'
                    },
                    fontFamily: {
                        tech: ['Orbitron', 'Rajdhani', 'system-ui', 'sans-serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'float-up': 'floatUp 6s ease-in-out infinite'
                    },
                    keyframes: {
                        floatUp: {
                            '0%,100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-glow {
                text-shadow: 0 0 10px #00A3FF, 0 0 20px rgba(0,163,255,0.5);
            }
            .text-shadow {
                text-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
            }
        }
        * { scroll-behavior: smooth; }
        body { color: #F6F8FF; overflow-x: hidden; }
        /* 高清亮背景 */
        .bg-img-layer {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-image: url('./assets/bg-fpga.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(1.05) contrast(1.08);
            transform: none;
            animation: none;
        }
        /* 极淡渐变遮罩 */
        .bg-mask-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.3));
        }
        /* 粒子光点层 */
        #particles-js {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="relative overflow-x-hidden font-sans min-h-screen flex flex-col justify-between">
    <!-- 背景图层 -->
    <div class="bg-img-layer"></div>
    <!-- 粒子光点层 -->
    <div id="particles-js"></div>
    <div class="bg-mask-layer"></div>

    <nav class="sticky top-0 bg-white/5 backdrop-blur-none border-b border-chipBlue z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-tech font-bold text-glow text-chipBlue flex items-center gap-3">
                <i class="fa-solid fa-microchip text-3xl animate-float-up"></i>
                <span>iFPGAer</span>
            </a>
            <!-- PC导航自动渲染容器 -->
            <div class="hidden lg:flex gap-8 font-tech tracking-wide text-shadow" id="pcNavWrap"></div>
            <button class="lg:hidden text-white text-2xl text-shadow" id="menuBtn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <!-- 移动端菜单容器 -->
        <div class="lg:hidden hidden bg-black/60 backdrop-blur-md border-b border-chipBlue absolute w-full" id="mobileMenu">
            <div class="container mx-auto px-4 py-4 flex flex-col gap-3 font-tech text-lg text-shadow" id="mobileNavWrap"></div>
        </div>
    </nav>

    <!-- 页面主体：保持你原来缩小、高透明二维码卡片，无改动 -->
    <main class="flex-grow flex items-center justify-center px-4">
        <div class="bg-black/15 backdrop-blur-md border border-chipBlue/15 rounded-xl p-6 max-w-xs w-full text-center">
            <h2 class="text-xl font-tech text-chipBlue text-glow mb-5">联系二维码</h2>
            <img src="./assets/qrcode.jpg" alt="微信联系二维码" class="w-4/5 mx-auto rounded-lg mb-5">
        </div>
    </main>
    <!-- 超紧凑小型页脚（篇幅极小） -->
    <footer class="border-t border-chipBlue/20 bg-black/10 py-3">
        <div class="container mx-auto px-4 text-center text-xs text-gray-300 text-shadow">
            <div class="flex flex-wrap justify-center gap-x-5 gap-y-1 mb-2">
                <span>Email:984962560@qq.com</span>
            </div>
            <p>© 2026 iFPGAer 仅用于学习交流</p>
        </div>
    </footer>

    <script>
        async function renderNav() {
            try {
                const res = await fetch('./assets/nav.json');
                const navData = await res.json();
                const pcWrap = document.getElementById('pcNavWrap');
                const mobileWrap = document.getElementById('mobileNavWrap');
                pcWrap.innerHTML = '';
                mobileWrap.innerHTML = '';

                // 获取当前文件名，剥离url查询参数
                function getCurrentFile(){
                    const path = window.location.pathname;
                    return path.split('/').pop() || 'index.html';
                }
                const currentFile = getCurrentFile();

                navData.forEach(item => {
                    // ========= 移动端菜单 =========
                    if (item.isDrop) {
                        item.child.forEach(sub => {
                            const a = document.createElement('a');
                            a.className = "py-2 hover:text-chipBlue";
                            a.href = sub.link;
                            a.innerText = sub.name;
                            mobileWrap.appendChild(a);
                        })
                    } else {
                        const a = document.createElement('a');
                        a.className = "py-2 hover:text-chipBlue";
                        const navFile = item.link.split('?')[0];
                        if(navFile === currentFile){
                            a.classList.add('text-chipBlue', 'border-b', 'border-chipBlue', 'pb-1');
                        }
                        a.href = item.link;
                        a.innerText = item.name;
                        mobileWrap.appendChild(a);
                    }

                    // ========= PC端导航 =========
                    if (!item.isDrop) {
                        const a = document.createElement('a');
                        a.className = "hover:text-chipBlue";
                        const navFile = item.link.split('?')[0];
                        if(navFile === currentFile){
                            a.classList.add('text-chipBlue', 'border-b', 'border-chipBlue', 'pb-1');
                        }
                        a.href = item.link;
                        a.innerText = item.name;
                        pcWrap.appendChild(a);
                    } else {
                        const groupDiv = document.createElement('div');
                        groupDiv.className = "relative group pb-2";
                        const span = document.createElement('span');
                        span.className = "hover:text-chipBlue cursor-pointer flex items-center gap-1";
                        span.innerHTML = `${item.name} <i class="fa-solid fa-chevron-down text-xs"></i>`;

                        const dropBox = document.createElement('div');
                        dropBox.className = "absolute hidden group-hover:block top-full left-0 mt-0 bg-black/60 backdrop-blur-md rounded-lg p-4 w-44 pointer-events-auto";
                        item.child.forEach(sub => {
                            const subA = document.createElement('a');
                            subA.className = "block py-2 hover:text-chipBlue";
                            subA.href = sub.link;
                            subA.innerText = sub.name;
                            dropBox.appendChild(subA);
                        })
                        groupDiv.appendChild(span);
                        groupDiv.appendChild(dropBox);
                        pcWrap.appendChild(groupDiv);
                    }
                })
            } catch (err) {
                console.error('导航加载失败：', err);
                const pcWrap = document.getElementById('pcNavWrap');
                pcWrap.innerHTML = '<span class="text-red-400">导航配置读取失败，请检查assets/nav.json</span>';
            }
        }
        renderNav();

        // 移动端菜单展开/收起逻辑
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            const icon = menuBtn.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-xmark');
        });
        document.querySelectorAll('#mobileMenu a').forEach(link => {
            link.onclick = () => mobileMenu.classList.add('hidden');
        });

        // 粒子背景
        particlesJS("particles-js", {
            particles: {
                number: { value: 30, density: { enable: true, value_area: 900 } },
                color: { value: "#00A3FF" },
                shape: { type: "circle" },
                opacity: { value: 0.15, random: true },
                size: { value: 1.2, random: true },
                line_linked: {
                    enable: true,
                    distance: 100,
                    color: "#00A3FF",
                    opacity: 0.06,
                    width: 0.4
                },
                move: {
                    enable: true,
                    speed: 0.4,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out"
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "grab" },
                    onclick: { enable: false },
                    resize: true
                },
                modes: { grab: { distance: 120, line_linked: { opacity: 0.2 } } }
            },
            retina_detect: true
        });
    </script>
</body>
</html>
