<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>详情页 | iFPGAer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chipBlue: '#00A3FF',
                        neonCyan: '#00F0C8',
                        neonPurple: '#7B2FFD',
                        darkBorder: 'rgba(0, 163, 255, 0.35)'
                    },
                    fontFamily: {
                        tech: ['Orbitron', 'Rajdhani', 'system-ui', 'sans-serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'float-up': 'floatUp 6s ease-in-out infinite'
                    },
                    keyframes: {
                        floatUp: {
                            '0%,100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-glow {
                text-shadow: 0 0 10px #00A3FF, 0 0 20px rgba(0,163,255,0.5);
            }
            .text-shadow {
                text-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
            }
            .toc-item-active{
                color:#00A3FF;
                border-left-color:#00A3FF;
            }
            .md-content h1 { font-size:1.4rem; font-weight:bold; margin:1.0rem 0 0.5rem; color:#00A3FF; border-bottom:1px solid rgba(0,163,255,0.2); padding-bottom:0.3rem; }
            .md-content h2 { font-size:1.2rem; font-weight:bold; margin:0.9rem 0 0.4rem; color:#00A3FF; }
            .md-content h3 { font-size:1.05rem; font-weight:bold; margin:0.7rem 0 0.35rem; color:#82d4ff; }
            .md-content p { margin:0.5rem 0; line-height:1.6; color:#e2e8f0; font-size:0.95rem; }

            .md-content pre {
                background:#f6f8fa !important;
                padding:1rem;
                border-radius:0.5rem;
                overflow-x:auto;
                margin:0.7rem 0;
                border:1px solid rgba(0,163,255,0.25);
                position: relative;
            }
            .md-content code { font-family:Consolas,Monaco,monospace; }
            .md-content pre code { color:#1e293b; font-size:13px; line-height:1.0; }

            .md-content :not(pre)>code { background:rgba(0,163,0,0.15); padding:0.12rem 0.35rem; border-radius:0.25rem; color:#7dd3fc; font-size:0.9rem; }
            .md-content ul, .md-content ol { padding-left:1.4rem; margin:0.5rem 0; }
            .md-content li { margin:0.25rem 0; color:#e2e8f0; font-size:0.95rem; }
            .md-content blockquote { border-left:3px solid #00A3FF; padding-left:1rem; opacity:0.85; margin:0.7rem 0; font-size:0.95rem; }
            .md-content table { width:100%; border-collapse:collapse; margin:0.9rem 0; font-size:0.9rem; }
            .md-content th,.md-content td { border:1px solid rgba(0,163,255,0.25); padding:0.4rem 0.6rem; }
            .md-content th { background:rgba(0,163,255,0.15); }

            .copy-btn{
                position:absolute;
                top:8px;
                right:8px;
                z-index:10;
                background:rgba(0,163,255,0.2);
                border:1px solid rgba(0,163,255,0.4);
                color:#00A3FF;
                border-radius:4px;
                padding:3px 8px;
                font-size:12px;
                cursor:pointer;
            }
            .copy-btn:hover{
                background:rgba(0,163,255,0.4);
            }
        }
        * { scroll-behavior: smooth; }
        body { color: #F6F8FF; overflow-x: hidden; }
        .bg-img-layer {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-image: url('./assets/bg-fpga.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(1.05) contrast(1.08);
        }
        .bg-mask-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.3));
        }
        #particles-js {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }
        /* 关键：给giscus容器左侧预留48px空白，抵消头像负margin */
        #giscus-container{
            padding-left:48px !important;
            margin-left:-48px !important;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="relative overflow-x-hidden font-sans min-h-screen flex flex-col">
    <div class="bg-img-layer"></div>
    <div id="particles-js"></div>
    <div class="bg-mask-layer"></div>

    <nav class="sticky top-0 bg-white/5 backdrop-blur-none border-b border-chipBlue/20 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-tech font-bold text-chipBlue flex items-center gap-3 text-glow">
                <i class="fa-solid fa-microchip text-3xl animate-float-up"></i>
                <span>iFPGAer</span>
            </a>
            <div class="hidden lg:flex gap-8 font-tech tracking-wide text-shadow" id="pcNavWrap"></div>
            <button class="lg:hidden text-white text-2xl text-shadow" id="menuBtn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <div class="lg:hidden hidden bg-black/60 backdrop-blur-md border-b border-chipBlue/20 absolute w-full" id="mobileMenu">
            <div class="container mx-auto px-4 py-4 flex flex-col gap-3 font-tech text-lg text-shadow" id="mobileNavWrap"></div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-10">
        <div class="mb-4" id="backBtnWrap">
            <a id="backLink" class="text-cyan-300 hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i>返回列表</a>
        </div>
        <div class="flex gap-6 flex-nowrap items-start">
            <aside id="tocWrap" class="hidden xl:block w-12 shrink-0 transition-all duration-300">
                <div class="sticky top-24 bg-black/40 backdrop-blur-md rounded-lg p-4 border border-chipBlue/20 max-h-[75vh]">
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="text-chipBlue font-bold text-sm"><i class="fa-solid fa-list-ul mr-1"></i>目录</h4>
                        <button id="tocToggleBtn" class="text-gray-300 hover:text-chipBlue text-xs px-2 py-1 rounded">
                            <i class="fa-solid fa-caret-right"></i>
                        </button>
                    </div>
                    <nav id="tocBox" class="hidden text-xs space-y-1.5 text-gray-300 overflow-y-auto max-h-[65vh] transition-all duration-300"></nav>
                </div>
            </aside>
            <div id="md-wrap" class="flex-1 min-w-0 bg-black/40 backdrop-blur-md rounded-xl p-6 md:p-8 border border-chipBlue/20 w-full">
                <div id="md-content" class="md-content">加载中...</div>
            </div>
        </div>

        <!-- 双层容器，外层圆角边框 -->
        <div class="mt-10 bg-black/40 backdrop-blur-md rounded-xl p-6 md:p-8 border border-chipBlue/20 overflow‑visible">
            <h3 class="text-chipBlue font-bold mb-4 text-lg"><i class="fa-solid fa-comments mr-2"></i>模块留言区</h3>
            <div id="giscus-container" class="w-full min-w-[340px]"></div>
        </div>
    </main>

    <footer class="border-t border-chipBlue/20 bg-black/10 py-3 mt-auto">
        <div class="container mx-auto px-4 text-center text-xs text-gray-300 text-shadow">
            <div class="flex flex-wrap justify-center gap-x-5 gap-y-1 mb-2">
                <span>Email:984962560@qq.com</span>
            </div>
            <p>© 2026 iFPGAer 仅用于学习交流</p>
        </div>
    </footer>

    <script>
        async function renderNav() {
            try {
                const res = await fetch('./assets/nav.json');
                const navData = await res.json();
                const pcWrap = document.getElementById('pcNavWrap');
                const mobileWrap = document.getElementById('mobileNavWrap');
                pcWrap.innerHTML = '';
                mobileWrap.innerHTML = '';
                function getCurrentFile(){
                    const path = window.location.pathname;
                    return path.split('/').pop() || 'index.html';
                }
                const currentFile = getCurrentFile();
                navData.forEach(item => {
                    if(item.children && item.children.length>0){
                        const pcDiv = document.createElement('div');
                        pcDiv.className = 'relative group';
                        const aTitle = document.createElement('a');
                        aTitle.className = 'cursor-pointer text-gray-200 group-hover:text-chipBlue';
                        aTitle.innerHTML = `${item.label} <i class="fa-solid fa-caret-down text-xs ml-1"></i>`;
                        const dropDiv = document.createElement('div');
                        dropDiv.className = 'absolute hidden group-hover:block pt-2 z-50';
                        dropDiv.innerHTML = `<div class="bg-black/80 backdrop-blur-md rounded-lg p-3 border border-chipBlue/20 min-w-[140px]">
${item.children.map(ch=>`<a href="${ch.href}" class="block py-1.5 text-gray-200 hover:text-chipBlue">${ch.label}</a>`).join('')}
</div>`;
                        pcDiv.appendChild(aTitle);
                        pcDiv.appendChild(dropDiv);
                        pcWrap.appendChild(pcDiv);

                        item.children.forEach(ch=>{
                            const ma = document.createElement('a');
                            ma.href = ch.href;
                            ma.className = 'py-2 hover:text-chipBlue';
                            ma.textContent = ch.label;
                            mobileWrap.appendChild(ma);
                        })
                    }else{
                        const pcA = document.createElement('a');
                        pcA.href = item.href;
                        pcA.className = (item.href === currentFile) ? 'text-chipBlue border-b border-chipBlue pb-1' : 'text-gray-200 hover:text-chipBlue';
                        pcA.textContent = item.label;
                        pcWrap.appendChild(pcA);

                        const ma = document.createElement('a');
                        ma.href = item.href;
                        ma.className = (item.href === currentFile) ? 'text-chipBlue py-2' : 'py-2 hover:text-chipBlue';
                        ma.textContent = item.label;
                        mobileWrap.appendChild(ma);
                    }
                })
            } catch (err) {
                console.error('导航加载失败',err);
            }
        }
        renderNav();

        //移动端菜单
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click',()=>{
            mobileMenu.classList.toggle('hidden');
            const icon = menuBtn.querySelector('i');
            if(mobileMenu.classList.contains('hidden')){
                icon.className = 'fa-solid fa-bars';
            }else{
                icon.className = 'fa-solid fa-xmark';
            }
        })
        mobileMenu.querySelectorAll('a').forEach(el=>el.onclick=()=>mobileMenu.classList.add('hidden'));

        //粒子
        particlesJS("particles-js", {
            particles: {
                number: { value:30, density:{enable:true,value_area:900} },
                color:{value:"#00A3FF"},
                shape:{type:"circle"},
                opacity:{value:0.15, random:true},
                size:{value:1.2, random:true},
                line_linked:{enable:true, distance:100, color:"#00A3FF", opacity:0.06, width:0.4},
                move:{enable:true, speed:0.4, direction:"none", random:true, straight:false, out_mode:"out"}
            },
            interactivity:{detect_on:"canvas",events:{onhover:{enable:true,mode:"grab"}, onclick:{enable:false}, resize:true},modes:{grab:{distance:120,line_linked:{opacity:0.2}}}},
            retina_detect:true
        });

        //详情主逻辑
        const urlParams = new URLSearchParams(window.location.search);
        const mdFileName = urlParams.get('md');
        const catName = urlParams.get('cat') || 'codelib';
        const backLink = document.getElementById('backLink');
        const backBtnWrap = document.getElementById('backBtnWrap');
        const giscusContainer = document.getElementById('giscus-container');
        const mdContentDom = document.getElementById('md-content');
        const tocBox = document.getElementById('tocBox');
        const tocWrap = document.getElementById('tocWrap');

        backLink.href = `page-base.html?cat=${catName}`;

        if(!mdFileName){
            mdContentDom.innerHTML = `<div class="text-red-400">参数缺失，请从列表页面跳转</div>`;
        }else if(typeof marked === 'undefined'){
            mdContentDom.innerHTML = `<div class="text-red-400">marked解析库加载失败，请刷新页面</div>`;
        }else{
            const mdUrl = `./docs/${mdFileName}`;
            console.log("请求md：", new URL(mdUrl,window.location.href));
            fetch(mdUrl)
                .then(resp=>{
                    if(!resp.ok) throw new Error(`文件不存在 ${mdFileName}`);
                    return resp.text();
                })
                .then(mdText=>{
                    if(!mdText.trim()){
                        mdContentDom.innerHTML = `<div class="text-yellow-400">MD文件为空</div>`;
                        return;
                    }
                    //YAML解析
                    let meta = {
                        title:"模块详情 | iFPGAer",
                        showBack:true,
                        showToc:true,
                        showComment:true
                    };
                    const fmReg = /^---\r?\n([\s\S]*?)\r?\n---/;
                    const fmMatch = mdText.match(fmReg);
                    let realMdText = mdText;
                    if(fmMatch){
                        realMdText = mdText.slice(fmMatch[0].length);
                        const lines = fmMatch[1].split('\n');
                        lines.forEach(line=>{
                            const kv = line.split(':');
                            if(kv.length>=2){
                                const k = kv[0].trim();
                                const v = kv.slice(1).join(':').trim();
                                if(v==='true') meta[k]=true;
                                else if(v==='false') meta[k]=false;
                                else meta[k]=v;
                            }
                        })
                    }
                    document.title = meta.title;
                    backBtnWrap.style.display = meta.showBack ? 'block' : 'none';

                    mdContentDom.innerHTML = marked.parse(realMdText);

                    //构建目录
                    const headings = mdContentDom.querySelectorAll("h1,h2,h3");
                    const tocData = [];
                    headings.forEach((h,idx)=>{
                        const id = `heading-${idx}`;
                        h.id = id;
                        tocData.push({
                            id:id,
                            text:h.innerText.trim(),
                            level: Number(h.tagName.replace("H",""))
                        })
                    })
                    if(meta.showComment){
                        giscusContainer.id = "giscus-comment-section";
                        tocData.push({
                            id:"giscus-comment-section",
                            text:"💬 评论区",
                            level:1
                        })
                    }

                    //渲染侧边目录
                    if(!meta.showToc || tocData.length === 0){
                        tocWrap.classList.add('hidden');
                    }else{
                        tocWrap.classList.remove('hidden');
                        tocBox.innerHTML = '';
                        tocData.forEach(item=>{
                            const a = document.createElement('a');
                            a.href = `#${item.id}`;
                            a.dataset.targetId = item.id;
                            a.className = "block py-1 pl-1 border-l-2 border-transparent hover:text-chipBlue toc-item";
                            a.style.paddingLeft = `${(item.level-1)*12 +4}px`;
                            a.textContent = item.text;
                            tocBox.appendChild(a);
                        })
                    }

                    //代码复制按钮
                    document.querySelectorAll('.md-content pre').forEach(pre=>{
                        const codeDom = pre.querySelector('code');
                        if(!codeDom) return;
                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'copy-btn';
                        copyBtn.innerHTML = `<i class="fa-solid fa-copy"></i> 复制`;
                        copyBtn.onclick = async ()=>{
                            try{
                                await navigator.clipboard.writeText(codeDom.innerText);
                                copyBtn.innerHTML = `<i class="fa-solid fa-check"></i> 已复制`;
                                setTimeout(()=>copyBtn.innerHTML=`<i class="fa-solid fa-copy"></i> 复制`,1200);
                            }catch(e){
                                alert("复制失败，请手动复制代码");
                            }
                        }
                        pre.appendChild(copyBtn);
                    })

                    //滚动高亮目录，兼容评论区锚点
                    const tocItems = tocBox.querySelectorAll('.toc-item');
                    window.addEventListener('scroll',()=>{
                        let activeId = null;
                        headings.forEach(h=>{
                            const rect = h.getBoundingClientRect();
                            if(rect.top <= 130) activeId = h.id;
                        })
                        if(meta.showComment){
                            const comRect = giscusContainer.getBoundingClientRect();
                            if(comRect.top <=130) activeId = "giscus-comment-section";
                        }
                        tocItems.forEach(it=>{
                            if(it.dataset.targetId === activeId){
                                it.classList.add('toc-item-active');
                            }else{
                                it.classList.remove('toc-item-active');
                            }
                        })
                    })

                    //目录折叠展开
                    const tocToggleBtn = document.getElementById('tocToggleBtn');
                    let tocOpen = false;
                    tocToggleBtn.addEventListener('click',()=>{
                        tocOpen = !tocOpen;
                        if(tocOpen){
                            tocBox.classList.remove('hidden');
                            tocToggleBtn.innerHTML = `<i class="fa-solid fa-caret-left"></i>`;
                            tocWrap.classList.remove('w-12');
                            tocWrap.classList.add('w-56');
                        }else{
                            tocBox.classList.add('hidden');
                            tocToggleBtn.innerHTML = `<i class="fa-solid fa-caret-right"></i>`;
                            tocWrap.classList.remove('w-56');
                            tocWrap.classList.add('w-12');
                        }
                    })

                    //评论区开关
                    if(meta.showComment){
                        giscusContainer.style.display = 'block';
                        loadGiscus();
                    }else{
                        giscusContainer.style.display = 'none';
                    }
                })
                .catch(err=>{
                    mdContentDom.innerHTML = `<div class="text-red-400">加载失败：${err.message}<br>请确认docs目录下该md文件已提交</div>`;
                    console.error(err);
                })
        }

        //Giscus加载
        function loadGiscus(){
            const pageTerm = mdFileName;
            const script = document.createElement('script');
            script.src = 'https://giscus.app/client.js';
            script.crossOrigin = "anonymous";
            script.async = true;
            script.dataset.repo = "iFPGAer/ifpgaer.github.io";
            script.dataset.repoId = "R_kgDOQmsdOg";
            script.dataset.category = "Announcements";
            script.dataset.categoryId = "DIC_kwDOQmsdOs4DDIB3";
            script.dataset.mapping = "specific";
            script.dataset.term = pageTerm;
            script.dataset.strict = "1";
            script.dataset.reactionsEnabled = "1";
            script.dataset.emitMetadata = "0";
            script.dataset.inputPosition = "bottom";
            script.dataset.theme = "dark_dimmed";
            script.dataset.lang = "zh-CN";

            giscusContainer.innerHTML = "";
            giscusContainer.appendChild(script);

            script.onload = function(){
                const timer = setInterval(()=>{
                    const iframe = giscusContainer.querySelector('iframe');
                    if(iframe){
                        iframe.style.width = "100%";
                        iframe.style.minWidth = "340px";
                        iframe.style.border = "none";
                        clearInterval(timer);
                    }
                },100)
            }
        }
    </script>
</body>
</html>
