<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPGA DEV - 首页门户</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        space: '#070A12',
                        glass: 'rgba(12, 18, 32, 0.18)',
                        chipBlue: '#00A3FF',
                        neonCyan: '#00F0C8',
                        neonPurple: '#7B2FFD',
                        neonPink: '#FF2D92',
                        darkBorder: 'rgba(0, 163, 255, 0.25)'
                    },
                    fontFamily: {
                        tech: ['Orbitron', 'Rajdhani', 'system-ui', 'sans-serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'glow-flow': 'glowFlow 4s linear infinite',
                        'float-up': 'floatUp 6s ease-in-out infinite',
                        'scan-light': 'scanLight 3s ease infinite'
                    },
                    keyframes: {
                        glowFlow: {
                            '0%, 100%': { boxShadow: '0 0 12px #00A3FF, 0 0 24px #7B2FFD' },
                            '50%': { boxShadow: '0 0 20px #00F0C8, 0 0 36px #FF2D92' }
                        },
                        floatUp: {
                            '0%,100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' }
                        },
                        scanLight: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .glass-card {
                @apply bg-glass backdrop-blur-sm border border-chipBlue/20 rounded-xl transition-all duration-500;
            }
            .glass-card:hover {
                @apply border-chipBlue/40 shadow-[0_0_18px_rgba(0,163,255,0.15)] -translate-y-1 bg-glass/30;
            }
            .text-glow {
                text-shadow: 0 0 10px #00A3FF, 0 0 20px rgba(0,163,255,0.5);
            }
            .text-soft-shadow {
                text-shadow: 0 0 8px rgba(0, 0, 0, 0.8), 0 0 16px rgba(0, 0, 0, 0.6);
            }
        }
        * { scroll-behavior: smooth; }
        body { color: #F6F8FF; overflow-x: hidden; }

        /* 背景图：无模糊、无动画、原图完整清晰展示 */
        .bg-img-layer {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-image: url('./assets/bg-fpga.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: none;
            transform: none;
            animation: none;
        }
        /* 极低透明度遮罩，最大程度保留原图细节 */
        .bg-mask-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-color: rgba(7, 10, 18, 0.22);
        }
        /* 弱化粒子，不遮挡背景画面 */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="relative overflow-x-hidden font-sans">
    <!-- 高清背景图层 -->
    <div class="bg-img-layer"></div>
    <!-- 轻微暗化遮罩 -->
    <div class="bg-mask-layer"></div>
    <!-- 极简点缀粒子 -->
    <div id="particles-js"></div>

    <!-- 页面主体内容 -->
    <div class="relative z-10 min-h-screen flex flex-col justify-between">
        <!-- 导航栏低遮挡 -->
        <nav class="sticky top-0 bg-glass/20 backdrop-blur-sm border border-darkBorder z-50">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <a href="index.html" class="text-2xl font-tech font-bold text-chipBlue flex items-center gap-3 text-glow text-soft-shadow">
                    <i class="fa-solid fa-microchip text-3xl animate-float-up"></i>
                    <span>FPGA DEV</span>
                </a>
                <div class="hidden md:flex gap-8 font-tech tracking-wide">
                    <a href="index.html" class="text-chipBlue border-b border-chipBlue pb-1 text-soft-shadow">首页</a>
                    <a href="resources.html" class="hover:text-chipBlue transition-colors text-soft-shadow">资源库</a>
                    <a href="verilog.html" class="hover:text-chipBlue transition-colors text-soft-shadow">Verilog教程</a>
                    <a href="tech.html" class="hover:text-chipBlue transition-colors text-soft-shadow">技术矩阵</a>
                    <a href="about.html" class="hover:text-chipBlue transition-colors text-soft-shadow">关于我</a>
                </div>
                <!-- 移动端菜单按钮 -->
                <button class="md:hidden text-white text-2xl" id="menuBtn">
                    <i class="fa-solid fa-bars text-soft-shadow"></i>
                </button>
            </div>
            <!-- 移动端侧边菜单 -->
            <div class="md:hidden hidden bg-glass/25 backdrop-blur-sm border border-darkBorder absolute w-full" id="mobileMenu">
                <div class="container mx-auto px-4 py-4 flex flex-col gap-4 font-tech text-lg">
                    <a href="index.html" class="py-2 text-chipBlue text-soft-shadow">首页</a>
                    <a href="resources.html" class="py-2 hover:text-chipBlue text-soft-shadow">资源库</a>
                    <a href="verilog.html" class="py-2 hover:text-chipBlue text-soft-shadow">Verilog教程</a>
                    <a href="tech.html" class="py-2 hover:text-chipBlue text-soft-shadow">技术矩阵</a>
                    <a href="about.html" class="py-2 hover:text-chipBlue text-soft-shadow">关于我</a>
                </div>
            </div>
        </nav>

        <!-- 主内容区，大量留白露出背景 -->
        <main class="py-32 flex-grow">
            <div class="container mx-auto px-6 max-w-5xl">
                <div class="text-center mb-24">
                    <h1 class="text-4xl md:text-6xl font-tech font-bold mb-6 text-soft-shadow">
                        <span class="text-chipBlue text-glow">FPGA</span> 硬件设计资源门户
                    </h1>
                    <p class="text-gray-200 text-lg max-w-2xl mx-auto text-soft-shadow">
                        专注数字电路、Verilog、Zynq开发，分类整理教程、工程源码、开发工具与面试资料
                    </p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <a href="resources.html" class="glass-card p-8 text-center block group">
                        <i class="fa-solid fa-folder-open text-5xl text-neonCyan group-hover:scale-110 transition-transform duration-300 mb-5"></i>
                        <h3 class="text-xl font-tech font-semibold mb-2 text-soft-shadow">资源下载库</h3>
                        <p class="text-gray-200 text-sm text-soft-shadow">全套教程源码、开发板例程、工具包、面试题库</p>
                    </a>
                    <a href="verilog.html" class="glass-card p-8 text-center block group">
                        <i class="fa-solid fa-code text-5xl text-chipBlue group-hover:scale-110 transition-transform duration-300 mb-5"></i>
                        <h3 class="text-xl font-tech font-semibold mb-2 text-soft-shadow">Verilog 完整教程</h3>
                        <p class="text-gray-200 text-sm text-soft-shadow">语法详解、时序/组合逻辑、可综合实战工程</p>
                    </a>
                    <a href="tech.html" class="glass-card p-8 text-center block group">
                        <i class="fa-solid fa-microchip text-5xl text-neonPink group-hover:scale-110 transition-transform duration-300 mb-5"></i>
                        <h3 class="text-xl font-tech font-semibold mb-2 text-soft-shadow">硬件技术矩阵</h3>
                        <p class="text-gray-200 text-sm text-soft-shadow">Verilog/VHDL/Vivado/Zynq/AXI 完整学习路线</p>
                    </a>
                    <a href="about.html" class="glass-card p-8 text-center block group">
                        <i class="fa-solid fa-user-astronaut text-5xl text-neonPurple group-hover:scale-110 transition-transform duration-300 mb-5"></i>
                        <h3 class="text-xl font-tech font-semibold mb-2 text-soft-shadow">关于开发者</h3>
                        <p class="text-gray-200 text-sm text-soft-shadow">开发经历、联系方式、资源失效反馈渠道</p>
                    </a>
                </div>
            </div>
        </main>

        <!-- 页脚极低遮挡 -->
        <footer class="border-t border-darkBorder py-6 bg-glass/15 backdrop-blur-sm">
            <div class="container mx-auto px-4 text-center font-tech text-gray-300 text-soft-shadow">
                <p>© 2026 FPGA DEV 硬件资源站 | 所有内容仅供硬件学习交流</p>
            </div>
        </footer>
    </div>

    <script>
        // 极少、极淡粒子，仅微弱点缀，不遮挡背景
        particlesJS("particles-js", {
            particles: {
                number: { value: 18, density: { enable: true, value_area: 800 } },
                color: { value: "#00A3FF" },
                shape: { type: "circle" },
                opacity: { value: 0.12, random: true },
                size: { value: 1, random: true },
                line_linked: {
                    enable: true,
                    distance: 120,
                    color: "#00A3FF",
                    opacity: 0.04,
                    width: 0.5
                },
                move: {
                    enable: true,
                    speed: 0.4,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out"
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "grab" },
                    onclick: { enable: true, mode: "push" },
                    resize: true
                },
                modes: {
                    grab: { distance: 140, line_linked: { opacity: 0.15 } }
                }
            },
            retina_detect: true
        });
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            const icon = menuBtn.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-xmark');
        });
        document.querySelectorAll('#mobileMenu a').forEach(link => {
            link.onclick = () => mobileMenu.classList.add('hidden');
        });
    </script>
</body>
</html>
