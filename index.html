<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFPGAer.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chipBlue: '#00A3FF',
                        neonCyan: '#00F0C8',
                        neonPurple: '#7B2FFD',
                        darkBorder: 'rgba(0, 163, 255, 0.35)'
                    },
                    fontFamily: {
                        tech: ['Orbitron', 'Rajdhani', 'system-ui', 'sans-serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'float-up': 'floatUp 6s ease-in-out infinite'
                    },
                    keyframes: {
                        floatUp: {
                            '0%,100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-glow {
                text-shadow: 0 0 10px #00A3FF, 0 0 20px rgba(0,163,0.5);
            }
            .text-shadow {
                text-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
            }
        }
        * { scroll-behavior: smooth; }
        body { color: #F6F8FF; overflow-x: hidden; }
        /* 高清亮背景 */
        .bg-img-layer {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-image: url('./assets/bg-fpga.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(1.05) contrast(1.08);
            transform: none;
            animation: none;
        }
        /* 极淡渐变遮罩 */
        .bg-mask-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.3));
        }
        /* === 新增二维码弹窗样式，仅追加，不修改原有样式 === */
        .qrcode-popup {
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.75);
            z-[9999];
            display: none;
            align-items: center;
            justify-content: center;
        }
        .qrcode-card {
            width: 90%;
            max-width: 320px;
            background: rgba(12, 18, 32, 0.92);
            backdrop-blur-lg;
            border: 1px solid rgba(0,163,255,0.3);
            border-radius: 14px;
            padding: 24px;
            text-align: center;
        }
        .close-qr {
            position: absolute;
            top:16px;
            right:16px;
            color:#aaa;
            hover:color:#00A3FF;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="relative overflow-x-hidden font-sans min-h-screen flex flex-col justify-between">
    <!-- === 新增二维码弹窗DOM，放在body最顶部，不影响原有结构 === -->
    <div class="qrcode-popup" id="qrPopup">
        <div class="qrcode-card relative">
            <button class="close-qr text-lg" id="closeQr">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img src="./assets/qrcode.jpg" alt="联系二维码" class="w-4/5 mx-auto rounded-md mb-4">
            <h3 class="text-lg font-tech text-chipBlue text-glow mb-2">扫码联系我</h3>
            <p class="text-gray-400 text-sm">FPGA交流/资源反馈</p>
        </div>
    </div>

    <!-- 背景图层 -->
    <div class="bg-img-layer"></div>
    <div class="bg-mask-layer"></div>
    <!-- 顶部导航栏（完全保留原版无修改） -->
    <nav class="sticky top-0 bg-white/5 backdrop-blur-none border-b border-chipBlue/20 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-tech font-bold text-chipBlue flex items-center gap-3 text-glow">
                <i class="fa-solid fa-microchip text-3xl animate-float-up"></i>
                <span>iFPGAer</span>
            </a>
            <div class="hidden lg:flex gap-8 font-tech tracking-wide text-shadow">
                <a href="index.html" class="text-chipBlue border-b border-chipBlue pb-1">首页</a>
                <div class="relative group">
                    <span class="hover:text-chipBlue cursor-pointer flex items-center gap-1">
                        资源库 <i class="fa-solid fa-chevron-down text-xs"></i>
                    </span>
                    <div class="absolute hidden group-hover:block top-full left-0 mt-2 bg-black/60 backdrop-blur-md rounded-lg p-4 w-44">
                        <a href="resources.html" class="block py-2 hover:text-chipBlue">全部资源汇总</a>
                        <a href="#" class="block py-2 hover:text-chipBlue">Verilog源码</a>
                        <a href="#" class="block py-2 hover:text-chipBlue">开发板例程</a>
                        <a href="#" class="block py-2 hover:text-chipBlue">工具安装包</a>
                    </div>
                </div>
                <div class="relative group">
                    <span class="hover:text-chipBlue cursor-pointer flex items-center gap-1">
                        学习教程 <i class="fa-solid fa-chevron-down text-xs"></i>
                    </span>
                    <div class="absolute hidden group-hover:block top-full left-0 mt-2 bg-black/60 backdrop-blur-md rounded-lg p-4 w-44">
                        <a href="verilog.html" class="block py-2 hover:text-chipBlue">Verilog完整指南</a>
                        <a href="#" class="block py-2 hover:text-chipBlue">VHDL入门</a>
                        <a href="#" class="block py-2 hover:text-chipBlue">Zynq软硬件协同</a>
                        <a href="#" class="block py-2 hover:text-chipBlue">时序分析实战</a>
                    </div>
                </div>
                <a href="tech.html" class="hover:text-chipBlue">技术矩阵</a>
                <a href="about.html" class="hover:text-chipBlue">关于我</a>
            </div>
            <button class="lg:hidden text-white text-2xl text-shadow" id="menuBtn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <div class="lg:hidden hidden bg-black/60 backdrop-blur-md border-b border-chipBlue/20 absolute w-full" id="mobileMenu">
            <div class="container mx-auto px-4 py-4 flex flex-col gap-3 font-tech text-lg text-shadow">
                <a href="index.html" class="py-2 text-chipBlue">首页</a>
                <a href="resources.html" class="py-2 hover:text-chipBlue">资源库</a>
                <a href="verilog.html" class="py-2 hover:text-chipBlue">Verilog教程</a>
                <a href="tech.html" class="py-2 hover:text-chipBlue">技术矩阵</a>
                <a href="about.html" class="py-2 hover:text-chipBlue">关于我</a>
            </div>
        </div>
    </nav>
    <!-- 中间完全空白，无任何元素遮挡背景（原版不变） -->
    <main class="flex-grow"></main>
    <!-- 超紧凑小型页脚：仅在原有行内追加极小二维码按钮，不改变原有排版 -->
    <footer class="border-t border-chipBlue/20 bg-black/10 py-3">
        <div class="container mx-auto px-4 text-center text-xs text-gray-300 text-shadow">
            <div class="flex flex-wrap justify-center gap-x-5 gap-y-1 mb-2">
                <span>联系：984962560@qq.com</span>
                <span>微信：iFPGAer_2025</span>
                <a href="https://github.com/iFPGAer" target="_blank" class="hover:text-chipBlue">Github</a>
                <!-- 仅新增极小二维码按钮，和其他行内元素并排，不增加高度 -->
                <button id="openQr" class="hover:text-neonCyan inline-flex items-center gap-1">
                    <i class="fa-solid fa-qrcode"></i> 扫码
                </button>
            </div>
            <p>© 2026 iFPGAer 仅用于学习交流</p>
        </div>
    </footer>
    <script>
        // 原有移动端菜单逻辑（完全保留无修改）
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            const icon = menuBtn.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-xmark');
        });
        document.querySelectorAll('#mobileMenu a').forEach(link => {
            link.onclick = () => mobileMenu.classList.add('hidden');
        });
        // === 仅追加二维码弹窗JS，不覆盖原有代码 ===
        const qrPopup = document.getElementById('qrPopup');
        const openQrBtn = document.getElementById('openQr');
        const closeQrBtn = document.getElementById('closeQr');
        // 打开弹窗
        openQrBtn.addEventListener('click', () => {
            qrPopup.style.display = 'flex';
        });
        // 关闭按钮
        closeQrBtn.addEventListener('click', () => {
            qrPopup.style.display = 'none';
        });
        // 点击遮罩空白关闭
        qrPopup.addEventListener('click', (e) => {
            if (e.target === qrPopup) qrPopup.style.display = 'none';
        });
    </script>
</body>
</html>
