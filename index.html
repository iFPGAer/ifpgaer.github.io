<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Welcome iFPGAer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入粒子光点库 -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chipBlue: '#00A3FF',
                        neonCyan: '#00F0C8',
                        neonPurple: '#7B2FFD',
                        darkBorder: 'rgba(0, 163, 255, 0.35)'
                    },
                    fontFamily: {
                        tech: ['Orbitron', 'Rajdhani', 'system-ui', 'sans-serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'float-up': 'floatUp 6s ease-in-out infinite'
                    },
                    keyframes: {
                        floatUp: {
                            '0%,100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-glow {
                text-shadow: 0 0 10px #00A3FF, 0 0 20px rgba(0,163,255,0.5);
            }
            .text-shadow {
                text-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
            }
        }
        * { scroll-behavior: smooth; }
        body { color: #F6F8FF; overflow-x: hidden; }
        /* 高清亮背景 */
        .bg-img-layer {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-image: url('./assets/bg-fpga.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(1.05) contrast(1.08);
            transform: none;
            animation: none;
        }
        /* 极淡渐变遮罩 */
        .bg-mask-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.3));
        }
        /* 粒子光点层 */
        #particles-js {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="relative overflow-x-hidden font-sans min-h-screen flex flex-col justify-between">
    <!-- 背景图层 -->
    <div class="bg-img-layer"></div>
    <!-- 粒子光点层 -->
    <div id="particles-js"></div>
    <div class="bg-mask-layer"></div>

    <!-- 顶部导航栏（修复下拉hover空隙问题） -->
    <nav class="sticky top-0 bg-white/5 backdrop-blur-none border-b border-chipBlue/20 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-tech font-bold text-chipBlue flex items-center gap-3 text-glow">
                <i class="fa-solid fa-microchip text-3xl animate-float-up"></i>
                <span>iFPGAer</span>
            </a>
            <div class="hidden lg:flex gap-8 font-tech tracking-wide text-shadow">
                <a href="index.html" class="text-chipBlue border-b border-chipBlue pb-1">首页</a>

                <!-- ==========资源库下拉：增加pb‑2消除hover空隙========== -->
                <div class="relative group pb-2">
                    <span class="hover:text-chipBlue cursor-pointer flex items-center gap-1">
                        资源库 <i class="fa-solid fa-chevron-down text-xs"></i>
                    </span>
                    <div class="absolute hidden group-hover:block top-full left-0 mt‑0 bg-black/60 backdrop-blur-md rounded-lg p-4 w-44 pointer-events-auto">
                        <a href="devtool.html" class="block py-2 hover:text-chipBlue">开发工具库</a>
                        <a href="codelib.html" class="block py-2 hover:text-chipBlue">模块库</a>
                        <a href="projectlib.html" class="block py-2 hover:text-chipBlue">工程库</a>
                    </div>
                </div>

                <!-- ==========学习教程下拉========== -->
                <div class="relative group pb-2">
                    <span class="hover:text-chipBlue cursor-pointer flex items-center gap-1">
                        学习教程 <i class="fa-solid fa-chevron-down text-xs"></i>
                    </span>
                    <div class="absolute hidden group-hover:block top-full left-0 mt‑0 bg-black/60 backdrop-blur-md rounded-lg p-4 w-44 pointer-events-auto">
                        <a href="grammar.html" class="block py-2 hover:text-chipBlue">基本语法</a>
                        <a href="toolusage.html" class="block py-2 hover:text-chipBlue">工具使用</a>
                        <a href="timing.html" class="block py-2 hover:text-chipBlue">时序约束</a>
                    </div>
                </div>

                <!-- ==========技术矩阵下拉========== -->
                <div class="relative group pb-2">
                    <span class="hover:text-chipBlue cursor-pointer flex items-center gap-1">
                        技术矩阵 <i class="fa-solid fa-chevron-down text-xs"></i>
                    </span>
                    <div class="absolute hidden group-hover:block top-full left-0 mt‑0 bg-black/60 backdrop-blur-md rounded-lg p-4 w-44 pointer-events-auto">
                        <a href="comm.html" class="block py-2 hover:text-chipBlue">通信处理</a>
                        <a href="imageproc.html" class="block py-2 hover:text-chipBlue">图像处理</a>
                        <a href="highspeedip.html" class="block py-2 hover:text-chipBlue">高速ip</a>
                    </div>
                </div>

                <a href="about.html" class="hover:text-chipBlue">关于我</a>
            </div>
            <button class="lg:hidden text-white text-2xl text-shadow" id="menuBtn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <!-- 移动端菜单，同步更新为真实页面链接 -->
        <div class="lg:hidden hidden bg-black/60 backdrop-blur-md border-b border-chipBlue/20 absolute w-full" id="mobileMenu">
            <div class="container mx-auto px-4 py-4 flex flex-col gap-3 font-tech text-lg text-shadow">
                <a href="index.html" class="py-2 text-chipBlue">首页</a>
                <a href="devtool.html" class="py-2 hover:text-chipBlue">开发工具库</a>
                <a href="codelib.html" class="py-2 hover:text-chipBlue">模块库</a>
                <a href="projectlib.html" class="py-2 hover:text-chipBlue">工程库</a>
                <a href="grammar.html" class="py-2 hover:text-chipBlue">基本语法</a>
                <a href="toolusage.html" class="py-2 hover:text-chipBlue">工具使用</a>
                <a href="timing.html" class="py-2 hover:text-chipBlue">时序约束</a>
                <a href="comm.html" class="py-2 hover:text-chipBlue">通信处理</a>
                <a href="imageproc.html" class="py-2 hover:text-chipBlue">图像处理</a>
                <a href="highspeedip.html" class="py-2 hover:text-chipBlue">高速ip</a>
                <a href="about.html" class="py-2 hover:text-chipBlue">关于我</a>
            </div>
        </div>
    </nav>

    <!-- 中间完全空白，无任何元素遮挡背景 -->
    <main class="flex-grow"></main>

    <!-- 超紧凑小型页脚（篇幅极小） -->
    <footer class="border-t border-chipBlue/20 bg-black/10 py-3">
        <div class="container mx-auto px-4 text-center text-xs text-gray-300 text-shadow">
            <div class="flex flex-wrap justify-center gap-x-5 gap-y-1 mb-2">
                <span>Email:984962560@qq.com</span>
            </div>
            <p>© 2026 iFPGAer 仅用于学习交流</p>
        </div>
    </footer>

    <script>
        // 原有移动端菜单逻辑
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            const icon = menuBtn.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-xmark');
        });
        document.querySelectorAll('#mobileMenu a').forEach(link => {
            link.onclick = () => mobileMenu.classList.add('hidden');
        });

        // 新增微弱科技光点粒子配置（淡蓝色、数量少、不遮挡背景）
        particlesJS("particles-js", {
            particles: {
                number: { value: 30, density: { enable: true, value_area: 900 } },
                color: { value: "#00A3FF" },
                shape: { type: "circle" },
                opacity: { value: 0.15, random: true },
                size: { value: 1.2, random: true },
                line_linked: {
                    enable: true,
                    distance: 100,
                    color: "#00A3FF",
                    opacity: 0.06,
                    width: 0.4
                },
                move: {
                    enable: true,
                    speed: 0.4,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out"
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "grab" },
                    onclick: { enable: false },
                    resize: true
                },
                modes: { grab: { distance: 120, line_linked: { opacity: 0.2 } } }
            },
            retina_detect: true
        });
    </script>
</body>
</html>
