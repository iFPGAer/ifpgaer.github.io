        }
    </style>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            const icon = menuBtn.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-xmark');
        });
        document.querySelectorAll('#mobileMenu a').forEach(link => {
            link.onclick = () => mobileMenu.classList.add('hidden');
        });

        particlesJS("particles-js", {
            particles: {
                number: { value: 30, density: { enable: true, value_area: 900 } },
                color: { value: "#00A3FF" },
                shape: { type: "circle" },
                opacity: { value: 0.15, random: true },
                size: { value: 1.2, random: true },
                line_linked: {
                    enable: true,
                    distance: 100,
                    color: "#00A3FF",
                    opacity: 0.06,
                    width: 0.4
                },
                move: {
                    enable: true,
                    speed: 0.4,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out"
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "grab" },
                    onclick: { enable: false },
                    resize: true
                },
                modes: { grab: { distance: 120, line_linked: { opacity: 0.2 } } }
            },
            retina_detect: true
        });

        const FIX_MD_FILE = "uart_module.md";
        const mdContentDom = document.getElementById('md-content');
        const tocBox = document.getElementById('tocBox');
        const tocWrap = document.getElementById('tocWrap');
        const mdUrl = `./docs/${FIX_MD_FILE}`;
        console.log("尝试加载md地址：", mdUrl);

        if(typeof marked === 'undefined'){
            mdContentDom.innerHTML = `<div class="text-red-400">marked解析库加载失败，请刷新重试</div>`;
        }else{
            fetch(mdUrl)
                .then(resp=>{
                    if(!resp.ok) throw new Error(`HTTP ${resp.status}，找不到文件：${mdUrl}`);
                    return resp.text();
                })
                .then(mdText=>{
                    if(!mdText.trim()){
                        mdContentDom.innerHTML = `<div class="text-yellow-400">md文件读取成功，但是文件内容为空</div>`;
                        return;
                    }
                    const html = marked.parse(mdText);
                    mdContentDom.innerHTML = html;

                    const headings = mdContentDom.querySelectorAll("h1,h2,h3");
                    console.log("识别到标题数量：", headings.length);
                    const tocData = [];
                    headings.forEach((h, idx)=>{
                        const id = `heading-${idx}`;
                        h.id = id;
                        tocData.push({
                            id:id,
                            text:h.innerText.trim(),
                            level:Number(h.tagName.replace("H",""))
                        })
                    });

                    // 没有标题，隐藏整个目录侧边栏
                    if(tocData.length === 0){
                        tocWrap.classList.add('hidden');
                    }else{
                        tocWrap.classList.remove('hidden');
                        tocBox.innerHTML = "";
                        tocData.forEach(item=>{
                            const a = document.createElement('a');
                            a.href=`#${item.id}`;
                            a.dataset.targetId = item.id;
                            a.className = "block py-1 pl-1 border-l-2 border-transparent hover:text-chipBlue toc-item";
                            a.style.paddingLeft = ((item.level-1)*12)+"px";
                            a.innerText = item.text;
                            tocBox.appendChild(a);
                        })
                    }

                    const preList = mdContentDom.querySelectorAll('pre');
                    preList.forEach(pre=>{
                        const codeText = pre.querySelector('code').innerText;
                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'copy-btn';
                        copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> 复制';
                        copyBtn.addEventListener('click',async ()=>{
                            try{
                                await navigator.clipboard.writeText(codeText);
                                copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> 已复制';
                                setTimeout(()=>{
                                    copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> 复制';
                                },1200);
                            }catch(e){
                                alert("复制失败，请手动复制代码");
                            }
                        })
                        pre.appendChild(copyBtn);
                    })

                    const tocItems = tocBox.querySelectorAll('.toc-item');
                    window.addEventListener('scroll',()=>{
                        let currentId = null;
                        headings.forEach(h=>{
                            const rect = h.getBoundingClientRect();
                            if(rect.top <= 120){
                                currentId = h.id;
                            }
                        })
                        tocItems.forEach(it=>{
                            if(it.dataset.targetId === currentId){
                                it.classList.add('toc-item-active');
                            }else{
                                it.classList.remove('toc-item-active');
                            }
                        })
                    })
                })
                .catch(err=>{
                    mdContentDom.innerHTML = `<div class="text-red-400">加载Markdown文档失败：${err.message}<br>请确认仓库根目录docs文件夹，存在文件：${FIX_MD_FILE}</div>`;
                })
        }
    </script>
